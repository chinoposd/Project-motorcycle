name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  ev-walailak-app-build:
    name: ev-walailak-app-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-walailak-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ev-walailak-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
